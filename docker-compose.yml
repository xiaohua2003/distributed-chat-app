services:
  redis:
    image: redis:7-alpine
    container_name: chat-redis
  
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_DB: chatdb
    volumes:
      - chat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  chat-server-1:
    build: ./server
    container_name: chat-server-1
    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - redis
      - postgres
  chat-server-2:
    build: ./server
    container_name: chat-server-2
    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - redis
      - postgres
  nginx:
    image: nginx:alpine
    container_name: chat-nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-server-1
      - chat-server-2
      - client

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chat-client
  caddy:
    image: caddy:2-alpine
    container_name: chat-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nginx

volumes:
  chat-postgres-data:
  caddy-data:
  caddy-config:
